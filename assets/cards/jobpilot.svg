<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
<stop offset="0" stop-color="#f59e0b"/><stop offset="0.5" stop-color="#ef4444"/><stop offset="1" stop-color="#f59e0b"/>
<animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect x="1" y="1" width="438" height="208" rx="16"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
.t{font-size:21px;font-weight:700;fill:#f8fafc}
.s{font-size:12px;fill:#f59e0b;letter-spacing:.4px}
.d{font-size:12.5px;fill:#cbd5e1}
.tag{font-size:10.5px;fill:#e2e8f0}
.m{font-size:12px;font-weight:600;fill:#f1f5f9}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.sweep{animation:sweep 5s linear infinite}
@keyframes sweep{from{transform:translateX(-120px)}to{transform:translateX(560px)}}
</style>
<rect x="1" y="1" width="438" height="208" rx="16" fill="url(#bg)"/>
<rect x="1" y="1" width="438" height="208" rx="16" fill="url(#glow)"/>
<g clip-path="url(#cp)"><rect class="sweep" x="0" y="0" width="60" height="210" fill="#fff" opacity="0.035" transform="skewX(-20)"/></g>
<rect x="1" y="1" width="438" height="208" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6"/>
<g class="fade" style="animation-delay:0.15s">
<text x="24" y="44" font-size="24">🚀</text>
<text x="58" y="42" class="t">JobPilot</text>
<text x="58" y="60" class="s">PERSONAL PROJECT · JOB SEARCH AUTOMATION</text>
<text x="24" y="92" class="d">Job discovery, tracker, recruiter email drafts and role</text>
<text x="24" y="110" class="d">profiles. Built edge-first on Cloudflare&#x27;s free tier.</text>
<g><rect x="24" y="128" rx="10" ry="10" width="46" height="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45"/><text x="47" y="143" text-anchor="middle" class="tag">React</text></g><g><rect x="78.0" y="128" rx="10" ry="10" width="78" height="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45"/><text x="117" y="143" text-anchor="middle" class="tag">TypeScript</text></g><g><rect x="164.0" y="128" rx="10" ry="10" width="78" height="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45"/><text x="203" y="143" text-anchor="middle" class="tag">Cloudflare</text></g><g><rect x="250.0" y="128" rx="10" ry="10" width="33" height="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45"/><text x="267" y="143" text-anchor="middle" class="tag">Zod</text></g><g><rect x="291.2" y="128" rx="10" ry="10" width="33" height="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45"/><text x="308" y="143" text-anchor="middle" class="tag">PWA</text></g>
<circle class="pulse" cx="30" cy="172" r="4" fill="#f59e0b"/>
<text x="42" y="176" class="m">Live on Cloudflare Workers</text>
<circle class="pulse" cx="30" cy="193" r="4" fill="#ef4444" style="animation-delay:1.2s"/>
<text x="42" y="197" class="m">Personal-first, SaaS-ready</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>