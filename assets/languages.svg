.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
.title{font-size:15px;font-weight:700;fill:#f8fafc}
.sub{font-size:11px;fill:#94a3b8}
.fade{animation:fade .7s ease backwards}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.lg{font-size:13px;fill:#e2e8f0}.seg{transform-box:fill-box;transform-origin:left;animation:grow .9s ease backwards}@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
