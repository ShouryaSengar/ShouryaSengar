<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></linearGradient>
<linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
<style>.n{font:600 13px 'JetBrains Mono','SFMono-Regular',Consolas,monospace;fill:#22d3ee}
.t{font:700 24px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#f8fafc}
.in{animation:in .7s ease backwards}@keyframes in{from{opacity:0;transform:translateX(-10px)}}
