<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a14"/><stop offset=".6" stop-color="#0c1530"/><stop offset="1" stop-color="#0a1226"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/>
<animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#67e8f9"/><stop offset=".7" stop-color="#a5b4fc"/><stop offset="1" stop-color="#f9a8d4"/>
<animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
<radialGradient id="mask" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gm"><rect width="900" height="330" fill="url(#mask)"/></mask>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity=".12"/>
<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="30 30" dur="4s" repeatCount="indefinite"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<clipPath id="card"><rect x="1" y="1" width="898" height="328" rx="22"/></clipPath>
<clipPath id="cl0"><rect x="0" y="0" height="30" width="0"><animate attributeName="width" values="0;0;464.4;464.4;0;0" keyTimes="0;0.000;0.100;0.200;0.230;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="cl1"><rect x="0" y="0" height="30" width="0"><animate attributeName="width" values="0;0;475.2;475.2;0;0" keyTimes="0;0.250;0.350;0.450;0.480;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="cl2"><rect x="0" y="0" height="30" width="0"><animate attributeName="width" values="0;0;464.4;464.4;0;0" keyTimes="0;0.500;0.600;0.700;0.730;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="cl3"><rect x="0" y="0" height="30" width="0"><animate attributeName="width" values="0;0;410.4;410.4;0;0" keyTimes="0;0.750;0.850;0.950;0.980;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
.hi{font:600 14px 'JetBrains Mono','SFMono-Regular',Consolas,monospace;fill:#22d3ee}
.nm{font-size:46px;font-weight:800;fill:url(#nm)}
.role{font-size:16px;fill:#94a3b8;letter-spacing:.3px}
.ty{font:600 18px 'JetBrains Mono','SFMono-Regular',Consolas,monospace;fill:#e2e8f0}
.pr{font:700 18px 'JetBrains Mono','SFMono-Regular',Consolas,monospace;fill:#ec4899}
.chip{font-size:12px;fill:#e2e8f0}
.tk{font:600 13px 'JetBrains Mono','SFMono-Regular',Consolas,monospace;fill:#22d3ee;opacity:.28;animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-12px);opacity:.45}}
.in{animation:in .9s ease backwards}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.sweep{animation:sw 7s linear infinite}@keyframes sw{from{transform:translateX(-200px) skewX(-20deg)}to{transform:translateX(1100px) skewX(-20deg)}}
.pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="898" height="328" rx="22" fill="url(#bg)"/>
<g clip-path="url(#card)">
  <g filter="url(#blur)" opacity=".55">
    <circle r="110" fill="#06b6d4"><animate attributeName="cx" values="120;300;120" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="70;140;70" dur="9s" repeatCount="indefinite"/></circle>
    <circle r="120" fill="#6366f1"><animate attributeName="cx" values="520;700;520" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="260;120;260" dur="10s" repeatCount="indefinite"/></circle>
    <circle r="90" fill="#ec4899"><animate attributeName="cx" values="820;640;820" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="60;200;60" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <rect width="900" height="330" fill="url(#grid)" mask="url(#gm)"/>
  <text class="tk" x="150" y="46" style="animation-delay:0s">SDUI</text><text class="tk" x="820" y="70" style="animation-delay:1.2s">RBAC</text><text class="tk" x="780" y="250" style="animation-delay:2.1s">{ }</text><text class="tk" x="90" y="280" style="animation-delay:0.7s">&lt;/&gt;</text><text class="tk" x="640" y="40" style="animation-delay:1.8s">OTA</text><text class="tk" x="380" y="314" style="animation-delay:2.6s">S3</text><text class="tk" x="40" y="46" style="animation-delay:3.1s">TS</text><text class="tk" x="860" y="170" style="animation-delay:0.4s">GQL</text>
  <rect class="sweep" x="0" y="0" width="70" height="330" fill="#fff" opacity=".04"/>
</g>
<!-- monogram -->
<g>
  <circle cx="108" cy="165" r="62" fill="#0b1220" stroke="url(#ring)" stroke-width="2.5"/>
  <circle cx="108" cy="165" r="76" fill="none" stroke="#22d3ee" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="4 10" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 108 165" to="360 108 165" dur="24s" repeatCount="indefinite"/></circle>
  <circle cx="108" cy="165" r="88" fill="none" stroke="#ec4899" stroke-opacity=".4" stroke-width="1" stroke-dasharray="2 14" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="360 108 165" to="0 108 165" dur="32s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#22d3ee"><animateMotion dur="6s" repeatCount="indefinite" path="M108,89 a76,76 0 1,1 -0.1,0"/></circle>
  <text x="108" y="182" text-anchor="middle" font-size="50" font-weight="800" fill="url(#ring)" class="mono">SS</text>
</g>
<g class="in">
  <text x="210" y="82" class="hi">&gt; hello, world. i'm</text>
  <text x="210" y="134" class="nm" textLength="560" lengthAdjust="spacingAndGlyphs">Shourya Singh Sengar</text>
  <text x="210" y="168" class="role">Software Engineer · Mobile · Web · Server-Driven Systems</text>
</g>
<g class="in" style="animation-delay:.4s">
  <text x="210" y="218" class="pr">$</text>
  <g transform="translate(232,199)"><g clip-path="url(#cl0)"><text x="0" y="18" class="ty" textLength="464.4" lengthAdjust="spacingAndGlyphs">Building apps used by 100,000+ people daily</text></g><rect y="0" width="9" height="20" rx="2" fill="#22d3ee" opacity="0"><animate attributeName="x" values="0;0;464.4;464.4;0;0" keyTimes="0;0.000;0.100;0.200;0.230;1" dur="20.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.100;0.200;0.230;1" dur="20.0s" repeatCount="indefinite"/></rect><g clip-path="url(#cl1)"><text x="0" y="18" class="ty" textLength="475.2" lengthAdjust="spacingAndGlyphs">Server-Driven UI · RBAC · OTA · Deep Linking</text></g><rect y="0" width="9" height="20" rx="2" fill="#22d3ee" opacity="0"><animate attributeName="x" values="0;0;475.2;475.2;0;0" keyTimes="0;0.250;0.350;0.450;0.480;1" dur="20.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.350;0.450;0.480;1" dur="20.0s" repeatCount="indefinite"/></rect><g clip-path="url(#cl2)"><text x="0" y="18" class="ty" textLength="464.4" lengthAdjust="spacingAndGlyphs">React Native · React · Node · GraphQL · AWS</text></g><rect y="0" width="9" height="20" rx="2" fill="#22d3ee" opacity="0"><animate attributeName="x" values="0;0;464.4;464.4;0;0" keyTimes="0;0.500;0.600;0.700;0.730;1" dur="20.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.600;0.700;0.730;1" dur="20.0s" repeatCount="indefinite"/></rect><g clip-path="url(#cl3)"><text x="0" y="18" class="ty" textLength="410.4" lengthAdjust="spacingAndGlyphs">Exploring AI-DLC and agentic workflows</text></g><rect y="0" width="9" height="20" rx="2" fill="#22d3ee" opacity="0"><animate attributeName="x" values="0;0;410.4;410.4;0;0" keyTimes="0;0.750;0.850;0.950;0.980;1" dur="20.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.850;0.950;0.980;1" dur="20.0s" repeatCount="indefinite"/></rect></g>
</g>
<g class="in" style="animation-delay:.7s"><g transform="translate(210,262)"><rect width="101" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="14" y="20" font-size="13">🏢</text><text x="34" y="20" class="chip">Monocept</text></g><g transform="translate(321,262)"><rect width="149" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="14" y="20" font-size="13">📍</text><text x="34" y="20" class="chip">Gurugram, India</text></g><g transform="translate(480,262)"><rect width="163" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="14" y="20" font-size="13">📱</text><text x="34" y="20" class="chip">100K+ daily users</text></g><g transform="translate(653,262)"><rect width="163" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="14" y="20" font-size="13">🏆</text><text x="34" y="20" class="chip">ET CIO Award 2024</text></g></g>
<circle class="pulse" cx="866" cy="32" r="5" fill="#34d399"/>
<rect x="1" y="1" width="898" height="328" rx="22" fill="none" stroke="url(#bd)" stroke-width="1.6"/>
</svg>